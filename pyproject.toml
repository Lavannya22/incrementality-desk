[project]
name = "incrementality-desk"
version = "1.0.0"
description = "Incrementality Desk: Criteo uplift dashboard (Streamlit + DuckDB) for a performance agency's skeptical CFO."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "google-genai>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.52",
]

[dependency-groups]
# Only needed to rebuild data/ from the raw 13.98M-row dataset (not needed to run or deploy the dashboard).
pipeline = [
    "huggingface_hub>=0.25",
    "pyarrow>=15",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false
